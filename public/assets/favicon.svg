<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    .bg-card {
      fill: #eef0f5;
      stroke: #cbd5e1;
    }
    .blazer {
      fill: #1e293b;
    }
    .collar {
      fill: #ffffff;
    }
    .tie {
      fill: #6366f1;
    }
    .tie-knot {
      fill: #4f46e5;
    }
    .skin {
      fill: #fcd34d;
    }
    .hair {
      fill: #1f2937;
    }
    .glasses-frame {
      fill: rgba(255, 255, 255, 0.35);
      stroke: #0f172a;
    }
    .glasses-bridge {
      stroke: #0f172a;
    }
    .eye {
      fill: #0f172a;
    }
    .glint {
      fill: #ffffff;
    }
    .mouth {
      stroke: #991b1b;
    }
    .lanyard-strap {
      fill: #0284c7;
    }
    .lanyard-badge {
      fill: #ffffff;
      stroke: #cbd5e1;
    }

    @media (prefers-color-scheme: dark) {
      .bg-card {
        fill: #0f172a;
        stroke: #6366f1;
      }
      .blazer {
        fill: #334155;
      }
      .glasses-frame {
        fill: rgba(255, 255, 255, 0.45);
        stroke: #0f172a;
      }
    }
  </style>

  <defs>
    <clipPath id="badge-clip">
      <rect x="16" y="16" width="480" height="480" rx="112" />
    </clipPath>
  </defs>

  <!-- Outer Adaptive Badge -->
  <rect class="bg-card" x="16" y="16" width="480" height="480" rx="112" fill="#eef0f5" stroke="#cbd5e1" stroke-width="16" />

  <g clip-path="url(#badge-clip)">
    <!-- Corporate Suit / Blazer Shoulders -->
    <path class="blazer" d="M 76 512 C 76 376 144 328 256 328 C 368 328 436 376 436 512 Z" fill="#1e293b" />

    <!-- White Shirt Collar V -->
    <polygon class="collar" points="184,332 256,422 328,332 292,318 256,318 220,318" fill="#ffffff" />

    <!-- Corporate Indigo Tie -->
    <polygon class="tie" points="236,374 276,374 290,482 256,512 222,482" fill="#6366f1" />
    <polygon class="tie-knot" points="232,344 280,344 272,380 240,380" fill="#4f46e5" />

    <!-- Subtle ID Lanyard Accent -->
    <rect class="lanyard-strap" x="342" y="346" width="16" height="58" rx="4" fill="#0284c7" />
    <rect class="lanyard-badge" x="328" y="398" width="44" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" />
    <rect x="336" y="408" width="28" height="6" rx="2" fill="#6366f1" />
    <rect x="336" y="418" width="18" height="4" rx="2" fill="#94a3b8" />

    <!-- Candidate Head -->
    <circle class="skin" cx="256" cy="212" r="122" fill="#fcd34d" />

    <!-- Side-Parted Professional Hair -->
    <path class="hair" d="M 134 202 C 134 114 192 78 262 78 C 334 78 378 122 378 202 C 360 170 332 156 290 154 C 242 152 204 170 176 190 C 158 196 144 202 134 202 Z" fill="#1f2937" />

    <!-- Spectacles (IT Engineer Signature) -->
    <rect class="glasses-frame" x="156" y="176" width="84" height="72" rx="18" fill="rgba(255, 255, 255, 0.35)" stroke="#0f172a" stroke-width="14" />
    <rect class="glasses-frame" x="272" y="176" width="84" height="72" rx="18" fill="rgba(255, 255, 255, 0.35)" stroke="#0f172a" stroke-width="14" />
    <line class="glasses-bridge" x1="240" y1="210" x2="272" y2="210" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />

    <!-- Eyes & Glints -->
    <circle class="eye" cx="198" cy="212" r="17" fill="#0f172a" />
    <circle class="eye" cx="314" cy="212" r="17" fill="#0f172a" />
    <circle class="glint" cx="204" cy="205" r="6" fill="#ffffff" />
    <circle class="glint" cx="320" cy="205" r="6" fill="#ffffff" />

    <!-- Determined Corporate Smirk -->
    <path class="mouth" d="M 232 284 Q 258 290 282 276" fill="none" stroke="#991b1b" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
